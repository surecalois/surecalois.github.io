function new_game(){

    var board0 = JSON.parse(JSON.stringify(game00.map(value => ({ value, sort: Math.random() }))

    .map(({ value }) => value)));

    board = lns.map(it => {
        var tmp =  board0.splice(0,it);

    });

document.onkeydown = function(event) {
    if (event.key === 'z' ||event.key === 'Z'|| event.key=='u'|| event.key=='U') {
        undo_it()
      }
    if(event.key === ' '){
        deal_cards()
    }
    if(event.key === 'N'){
        new_game()
    }
    if(event.key === 'H'||event.key === 'h'){
        show_hint()
    }

    if(event.key === '1' & event.ctrlKey){
        new_game_one()
    }

    if(event.key === '2' & event.ctrlKey){
        new_game_two()
    }

    if(event.key === '4' & event.ctrlKey){
        new_game_four()
    }

    if(event.key === 'm'||event.key === 'M'){
        if(keep_moving){
            auto_move();
        }else{
            clearInterval(autoid);
        }
        keep_moving = !keep_moving;
    }
}

function undo_it(){
    if(hist_board.length>0){
        var tmp = JSON.parse(hist_board.pop());
        if(typeof(tmp)=='number'){
            n_run=tmp
            deal_btn.dataset.badge = (cards_to_deal.length-n_run)/10;
            board = JSON.parse(hist_board.pop());
        }else{
            board = tmp;
        }
        board_to_html()
    }else{
        n_run = 0;
        deal_btn.dataset.badge = (cards_to_deal.length-n_run)/10;
    }
}

function deal_cards(){
    var empty = board.map(it => it.length).indexOf(0);
    if((n_run+10) <= cards_to_deal.length && empty ==-1){
        var new_cards = cards_to_deal.slice(n_run,n_run+10);
        hist_board.push(JSON.stringify(board));
        hist_board.push(JSON.stringify(n_run));
        n_run=n_run+10;

        board.forEach((it,k) =>{
            new_cards[k][2]=true;
            it.unshift(new_cards[k])
        })
        board_to_html();
        // a deal can complete a K..A run too, remove it like after a normal move
        board.forEach((it,k) => things_to_clear(k));
        deal_btn.dataset.badge = (cards_to_deal.length-n_run)/10;
    }
}

function get_top(total_n, visible_n, k) {
    var top;
    const hidden_n = total_n - visible_n
    const height = 600
    const card_height = 200
    var visible_top = 30
    var hidden_top = visible_top / 2
    var total_length = card_height + 1 + hidden_top * hidden_n + (visible_n - 1) * visible_top
    if (total_length > height) {

        visible_top = (height - card_height - 1) / (hidden_n / 2 + visible_n - 1)
        hidden_top = visible_top / 2
        //total_length = card_height+1+hidden_top*hidden_n+ (visible_n-1)*visible_top
    }
    if (k < hidden_n) {
        top = 1 + hidden_top * k;
    } else {
        top = 1 + hidden_top * hidden_n + (k - hidden_n) * visible_top
    }
    return top;
}

function column_remove(k,a){
    var col_cards = Array.from(columns[k].children)
    var l = col_cards.length;
    var out_cards =[];
    for(i = a; i < l; i++){
        out_cards.push(columns[k].removeChild(col_cards[i]));
    }
    const col_n = board[k].length
    const vis_n = board[k].filter(it => it[2]).length

    Array.from(col_cards).forEach((it,k) => {
        it.style.top = get_top(col_n, vis_n,k) + "px";
        it.style.zIndex = 100+k;
    })

    //check to make the last card visiable
    if(a > 0){
        make_visiable(columns[k].children[a-1])
    }
    return out_cards;
}

function column_append(k,cards){

    cards.forEach(it =>columns[k].appendChild(it));
    var col_cards = Array.from(columns[k].children)

    const col_n = board[k].length
    const vis_n = board[k].filter(it => it[2]).length

    Array.from(col_cards).forEach((it,k) => {
        it.style.top = get_top(col_n, vis_n,k) + "px";
        it.style.zIndex = 100+k;
    })
}

function nice(sth) {
    return all_visiable(sth)&&same_color(sth)&&right_order(sth)
}

function same_color(sth){
    var ans = sth.findIndex(it => it[1] != sth[0][1])
    if (ans != -1) {
        return false;
    }else{
        return true;
    }
}

function all_visiable(sth){
    var ans = sth.findIndex(it => !it[2])
    if (ans != -1) {
        return false;
    }else{
        return true;
    }
}

function right_order(sth){
    var u = sth.map(it => it[0]);
    // console.log(u)
    var t = u.shift();
    ans = true;
    while (u.length != 0 & ans) {
        // console.log(u);
        ans = t == u[0] - 1;
        t = u.shift();
    }
    return ans;
}

function things_to_clear(j) {
    const wl = 13;
    var l = board[j].length;
    if (board[j][0][0] == 1 && l >= wl) {
        var sth = board[j].slice(0, wl);
        if(all_visiable(sth)&&same_color(sth)&&right_order(sth)){
            collection =collection.concat(board[j].splice(0,wl)) ;
            if (board[j].length > 0) {
                board[j][0][2] = true
            }
            // board_to_html();
            column_remove(j,l-wl);
        }
    }
}

function ok_to_pickup(from_j, m) {
    var bl_j = board[from_j].length;
    var sth = board[from_j].slice(0, bl_j - m);
    //console.log(sth)
    if (sth[bl_j - m - 1][2]) {
        return nice(sth);
    } else {
        return false;
    }
}

function column_pickable(k){
    var the_column = JSON.parse(JSON.stringify(board[k]));
    var ans = []
    the_column.every((it,i) =>{
        var tmp = the_column.slice(0,i+1)
        if(nice(tmp)){
            ans.push(tmp[i])
            return true;
        }else{
            return false;
        }
    })
    return ans;
}

            var to_i = indexOfAll(next,it[0]);

function suit_map(x){
    if(x == 0x00) return 0
    if(x == 0x10) return 3
    if(x == 0x20) return 2
    if(x == 0x30) return 1
}

function plspider_loader(pl){
    //console.log(pl)
    var cards = pl.cards;
    var g_cards = cards.map(its =>{
        return its.map(it =>{
            return [Math.abs(it) & 0xf, suit_map(Math.abs(it) & 0xf0) , it >0]
        })
    })

    if('answer' in pl){
        ans0 = pl.answer
    }
    
    var out ={
        "cards_to_deal": g_cards[0].reverse(),
        "current_board": g_cards.slice(1,11),
        "current_deal":0,
        "history_board":[]
    }

    out.current_board.forEach(it => {
        it = it.reverse()
    });
    return out    
}


function load_ans(ansstr_raw){
    var ans = ansstr_raw.split("\n");
    var ansstr = ans[0];
    //const start = ans.match(/\d+:\d+>\d+/).index //what if you need to deal a round first
    const start = ansstr.indexOf("GMT ")+ "GMT ".length
    var flag = ansstr.indexOf("#");
    var ansarr = ansstr.slice(start,ansstr.length).split(" ")
    ans0 = ansarr.map(it =>{
        var itz = it.replaceAll(/\s+/g,"")
        if(itz.length > 3){
            var r = '['+itz.replace(/[^\w]/g,',')+']';
            var ok = JSON.parse(r);
            if(flag!=-1){
                ok[1] = -ok[1]
            }
            return ok;
        }else{
            return itz;
        }
    })
    //return(ans0)
}

        e = e || window.Event;

        // calculate the new cursor position:
        pos1 = pos3 - e.clientX;

        var dd = Math.abs(pos1)+Math.abs(pos2)

        document.onmouseup = null;
        document.onmousemove = null;
    }

}

/*
 * Card input: drag a card (or the run on top of it) onto another column and release.
 * The column under the pointer is highlighted while dragging.
 * Double click moves the card(s) to the best connection.
 * (There is no click-to-select / click-to-move any more. The old version is spider.js.bak.)
 */
function clickElement(elmnt) {
    elmnt.onmousedown = down;

    // column of the card that was pressed, and its row (div index, 0 = bottom card)
    function locate() {
        var rect = elmnt.getClientRects()[0]
        var from_j = which_column(rect.left + rect.width / 2);
        return [from_j, Array.from(columns[from_j].children).indexOf(elmnt)];
    }

    // double click: where should this card go? returns the column or -1
    function semi_auto_move(from_j, row_i) {
        if (!ok_to_pickup(from_j, row_i)) return -1;
        var entry = all_movable.findIndex(it => JSON.stringify(it[0]) == elmnt.dataset.sth && from_j == it[1])
        if (entry != -1) {
            var mv = all_movable[entry];
            /**the card, from_column,to_column,color_match,from_row */
            return [mv[2], board[mv[1]].length - 1 - mv[4]];
        }
        return [board.map(it => it.length).indexOf(0), row_i];
    }

    function reset(cards, from_j, row_i) {
        cards.forEach((it, z) => {
            it.style.transform = "none";
            it.style.zIndex = 100 + z + row_i;
        })
    }

    function down(e) {
        e = e || window.event;
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();

        var loc = locate(), from_j = loc[0], row_i = loc[1];

        var delta_t = e.timeStamp - timestamp;
        timestamp = e.timeStamp;
        if (delta_t < 300) {
            var auto = semi_auto_move(from_j, row_i);
            if (auto != -1 && auto[0] != -1) {
                move_to_col_k(from_j, auto[0], auto[1]);
                return;
            }
        }

        if (!ok_to_pickup(from_j, row_i)) return;

        var c_cards = Array.from(columns[from_j].children).slice(row_i);
        c_cards.forEach((it, z) => { it.style.zIndex = 1000 + z; })

        var x0 = e.clientX, y0 = e.clientY, dragging = false;

        document.onmousemove = function (ev) {
            var dx = ev.clientX - x0, dy = ev.clientY - y0;
            if (!dragging) {
                if (Math.abs(dx) + Math.abs(dy) < 6) return; // still a click
                dragging = true;
            }
            ev.preventDefault();
            c_cards.forEach(it => { it.style.transform = `translate(${dx}px, ${dy}px)`; })
            var over = which_column(ev.clientX);
            columns.forEach((c, k) => c.classList.toggle("drop_hint", k == over && k != from_j));
        }

        document.onmouseup = function (ev) {
            document.onmousemove = null;
            document.onmouseup = null;
            columns.forEach(c => c.classList.remove("drop_hint"));
            if (dragging) {
                // dropped: the column under the pointer
                var to_k = which_column(ev.clientX);
                reset(c_cards, from_j, row_i);
                if (to_k != from_j) {
                    move_to_col_k(from_j, to_k, row_i);
                    update_column(from_j);
                }
            } else {
                // plain click without moving: nothing is selected, just put the cards back
                reset(c_cards, from_j, row_i);
            }
        }
    }
}

 *   hid[k]   number of face-down cards at the bottom of column k

 *

        if (mv.deal) { flash([deal_btn]); return; }
        const src = columns[mv.from].children[board[mv.from].length - mv.n];
        const tgt = board[mv.to].length ? columns[mv.to].children[board[mv.to].length - 1] : document.querySelectorAll('.col-line')[mv.to];
        flash([src, tgt]);
    }

    function doPlanMove() {
        if (!plan || plan.pos < 0 || plan.pos >= plan.moves.length) return false;
        const mv = plan.moves[plan.pos];
        if (mv.deal) deal_cards();
        else move_to_col_k(mv.from, mv.to, board[mv.from].length - mv.n);
        boardChanged();
        return plan && plan.pos >= 0;
    }

    function stopPlay() {
        if (playTimer) { clearTimeout(playTimer); playTimer = null; }
        if(playBtn) playBtn.textContent = 'Play';
    }

    function stepPlay(){
        if (playTimer) { stopPlay(); return; }
        if (!plan || plan.pos < 0) return;
        if (!doPlanMove() || plan.pos >= plan.moves.length) { 
            stopPlay(); 
        }
        render(); return; 
    }

    function togglePlay() {
        if (playTimer) { stopPlay(); return; }
        if (!plan || plan.pos < 0) return;
        if(playBtn) playBtn.textContent = 'Pause';
        const step = () => {
            if (!doPlanMove() || plan.pos >= plan.moves.length) { stopPlay(); render(); return; }
            playTimer = setTimeout(step, 250);
        };
        playTimer = setTimeout(step, 0);
    }

    const originalShowHint = window.show_hint;
    window.show_hint = function () {
        if (plan && plan.pos >= 0 && plan.pos < plan.moves.length) showPlanMove();
        else originalShowHint();
    };

    // ---------------- plspider deal by number ------------------------------
    function loadPlGame() {
        const s = window.prompt('plspider game number (1..32000 are known winnable, except 1748 and 14934):', '1');
        if (s === null) return;
        const n = parseInt(s, 10);
        if (!(n > 0)) return;
        stopPlay();
        if (job) job.cancel();
        plan = null;
        load_game(plspider_loader({ cards: AI.plDeal(n) }));
        message = `plspider game ${n}`;
        deal_btn.dataset.badge = (cards_to_deal.length - n_run) / 10;
        render();
    }

    // new game / load: forget the old plan
    ['new_game', 'load_game'].forEach(name => {
        const orig = window[name];
        window[name] = function () {
            stopPlay();
            if (job) job.cancel();
            plan = null;
            message = '';
            const r = orig.apply(this, arguments);
            render();
            return r;
        };
    });

    // ---------------- wiring --------------------------------------------------
    if(solveBtn) solveBtn.onclick = () => { solveBtn.blur(); startSolve(); };
    if(playBtn) playBtn.onclick = () => { playBtn.blur(); togglePlay(); };
    //document.getElementById('plgame').onclick = function () { this.blur(); loadPlGame(); };

    document.addEventListener('keydown', e => {
        //console.log("keydown in ui_ai"+e.key);
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === 's' || e.key === 'S') startSolve();
        else if (e.key === 'p' || e.key === 'P') togglePlay();
        else if (e.key === 'g' || e.key === 'G') loadPlGame();
        else if (e.key === 'j' || e.key === 'J') stepPlay();
    });

    window.spiderAiUi = { startSolve, togglePlay, doPlanMove, get plan() { return plan; }, render };
    render();
})();
</script>
</body>

</html>
