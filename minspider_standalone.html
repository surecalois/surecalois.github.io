<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b5e3a">
<title>MinSpider</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b5e3a; touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 820px; margin: 0 auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #top { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; font-size: 14px; opacity: .9; }
  #board { flex: 1; position: relative; display: flex; gap: var(--gap, 3px); padding: 4px var(--gap, 3px); min-height: 0; }
  /* phone (portrait): two rows of 5 columns; render() uses the same query */
  @media (max-width: 700px) and (orientation: portrait) {
    #board { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: 1fr 1fr; gap: var(--gap, 3px); }
  }
  .col { flex: 1; position: relative; border-radius: 5px; border: 1px solid rgba(255,255,255,.15); min-width: 0; }
  .card { position: absolute; width: var(--cw, 100%); left: calc((100% - var(--cw, 100%)) / 2); border-radius: calc(var(--w) * .1); background: #fff; color: #111;
    border: 1px solid #555; overflow: hidden; line-height: 1; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .card b { position: absolute; left: 6%; top: 4%; font-size: calc(var(--w) * .42); font-weight: 700; letter-spacing: -.04em; }
  .card i { position: absolute; left: 7%; top: calc(var(--w) * .46); font-style: normal; font-size: calc(var(--w) * .40); }
  .card em { position: absolute; right: 8%; bottom: 2%; font-style: normal; font-size: calc(var(--w) * .8); opacity: .18; }
  .card.down { background: repeating-linear-gradient(45deg, #2f5fb5 0 4px, #264f99 4px 8px); border-color: #fff; }
  .card.down * { display: none; }
  .s0 { color: #111; } .s1 { color: #d11a2a; } .s2 { color: #0a7a2f; } .s3 { color: #1a55d1; }
  .card.sel { outline: 3px solid #ffd400; outline-offset: -2px; z-index: 5; filter: brightness(.93); }
  .card.hint { outline: 3px solid #00e5ff; outline-offset: -2px; animation: pulse .6s ease-in-out 4; }
  .col.hintdest { border: 2px solid #00e5ff; }
  .col.shake { animation: shake .3s; }
  @keyframes pulse { 50% { filter: brightness(1.25); } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  #bar { display: flex; gap: 6px; padding: 6px 8px 10px; }
  #bar button { flex: 1; position: relative; font-size: 15px; padding: 12px 0; border: 0; border-radius: 10px; color: #fff;
    background: rgba(0,0,0,.28); font-weight: 600; }
  #bar button:active { background: rgba(0,0,0,.5); }
  #bar button:disabled { opacity: .35; }
  #deal .badge { position: absolute; right: 4px; top: -6px; background: #c62828; border-radius: 10px; min-width: 20px;
    padding: 2px 5px; font-size: 12px; }
  #ai { min-height: 18px; padding: 0 10px 2px; font-size: 12px; opacity: .85; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bSolve.on { background: #ffd400; color: #222; }
  #toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 8px 14px;
    border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; z-index: 30; text-align: center; }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0; font-size: 34px; }
  #overlay button, .menu button { font-size: 17px; padding: 12px 22px; border: 0; border-radius: 10px; background: #ffd400; color: #222; font-weight: 700; }
  .menu { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center;
    z-index: 25; }
  .menu.show { display: flex; }
  .menu .box { background: #174d31; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
  .menu .box h2 { margin: 0 0 4px; font-size: 18px; text-align: center; }
  .menu .box button.alt { background: rgba(255,255,255,.18); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="info"></span><span id="score"></span></div>
  <div id="board"></div>
  <div id="ai" role="status"></div>
  <div id="bar">
    <button id="bFile">File</button>
    <button id="bUndo">Undo</button>
    <button id="bHint">Hint</button>
    <button id="bSolve">Solve</button>
    <button id="deal">Deal<span class="badge" id="badge">5</span></button>
  </div>
</div>
<div id="toast"></div>
<div id="fileMenu" class="menu"><div class="box">
  <h2>File</h2>
  <button id="fNew">New game…</button>
  <button id="fSave">Save to file</button>
  <button id="fLoad">Load from file</button>
  <button class="alt" id="fCancel">Cancel</button>
</div></div>
<input type="file" id="loadInput" accept=".json,application/json" style="display:none">
<div id="menu" class="menu"><div class="box">
  <h2>New game</h2>
  <button data-suits="1">1 suit (easy)</button>
  <button data-suits="2">2 suits</button>
  <button data-suits="4">4 suits (hard)</button>
  <button class="alt" id="mCancel">Cancel</button>
</div></div>
<div id="overlay"><h1>You won! 🎉</h1><div id="winInfo"></div><button id="bAgain">Play again</button></div>

/*
 * spider_endgame.js - exact, deterministic solver for endgames with 3 sets or fewer left
 * (at most 39 cards on the board + in the stock), stock deals included.
 *
 * spider_ai.js runs it first in solve() when that condition is met (SpiderAI.solve, stage 'endgame exact').
 * Command line tool, tests and the case generator: spider_endgame/endgame3.js.
 *
 * Deterministic: no randomness and no time based decisions, ties are broken by creation order, so a position
 * always gives the same answer and the same line.
 * Complete: a reachability search with a visited set. When the queue runs dry without a win the position is
 * PROVED lost (status 'exhausted'). The only inconclusive result is 'limit' (maxStates reached).
 *

 *   cols[k]  card codes bottom -> top, code = rank | suit << 4
 *   hid[k]   number of face-down cards at the bottom of column k
 *   stock    the cards still to deal, 10 per deal, card k of a deal goes on column k
 * Moves are spider_ai.js moves: {from, to, n} (0-based columns, the top n cards) or {deal: true}.
 *
 * Exact with deals left: a deal puts stock card k on column k, so the key of a position keeps the column order
 * and every empty column is its own target (also for moving a whole column into it). With no deal left the
 * columns are interchangeable: sorted key, only the first empty column is offered, no whole-column relocation.
 *

    let MODEL = null;

    function setModel(m) { MODEL = m; }

    function policyScore(f) {

        for (let i = 0; i < NF; i++) x[i] = (f[i] - m.mu[i]) / m.sd[i];
        let s = 0;
        for (let i = 0; i < NF; i++) s += m.w[i] * x[i];

    // policy over the legal moves: [{mv, child, logp}]
    function policy(st, ctx, prev, bindings) {

        for (const o of out) if (o.sc > mx) mx = o.sc;

        for (const o of out) z += Math.exp(o.sc - mx);

    // ---------- search -----------------------------------------------------

    class Heap {

    // goal: 'win' (clear the board) | 'empty' (get an empty column, no dealing)
    class Search {
        constructor(st, ctx, opts) {
            this.ctx = ctx;
            this.opts = Object.assign({ maxStates: 300000, goal: 'win', allowDeal: true, depthW: 0.15 }, opts);
            this.goal = this.opts.goal;
            this.visited = new Set();

        }

        finish(node) {
            const path = [];
            for (let n = node; n && n.mv; n = n.parent) path.push(n.mv);
            this.moves = path.reverse();
            this.status = 'solved';
        }

        // work for about `ms` milliseconds, returns the status
        run(ms) {
            const t0 = Date.now();
            const o = this.opts;
            while (this.status === 'running') {
                if ((this.expanded & 31) === 0 && Date.now() - t0 > ms) break;
                const node = this.heap.pop();
                if (!node) { this.status = 'exhausted'; break; }
                this.expanded++;
                const st = decode(node.s);
                node.s = null;
                const moves = genMoves(st, o.allowDeal, o.bindings);
                for (let i = 0; i < moves.length; i++) {
                    const c = applyMove(st, moves[i], this.ctx);
                    const ck = canonKey(c, o.bindings);
                    if (this.visited.has(ck)) continue;
                    this.visited.add(ck);
                    const child = {
                        s: encode(c),
                        p: score(c, this.ctx, this.goal) - (node.depth + 1) * o.depthW,

    // Beam search: advance layer by layer (one move per layer), keep the best `width`
    // positions of every layer. Many alternatives are alive at the same time so it
    // backs out of bad lines, unlike a greedy walk (width 1). Not complete, a failure
    // only means "not found with this width".
    class BeamSearch {
        constructor(st, ctx, opts) {

        run(ms) {

                    this.level = this.next;

            { label: 'beam 400', make: () => new BeamSearch(st, ctx, { width: 400, lam, decay: 0.9, endgame: o.endgame !== false }) },

        const keys = [encode(st)];

    // quick facts about a position
    function describe(st, ctx) {

        let links = 0;

            hidden: st.hid.reduce((a, b) => a + b, 0),

    function plDeal(game) {

    // A deal is written as its 10 columns, each = its cards (bottom -> top) + the stock cards it will get.
    //   exact: that list as it is. Same deal, same id, whatever the file (json_log, json_db, pl_db, number).
    //   game:  the smallest such list over every order of the columns and every renaming of the suits.
    //          The rules do not depend on either (a column keeps its own stock cards), so two deals with the
    //          same game id are the same game.
    // id = "<suits>-<16 hex digits of FNV-1a 64>", e.g. "4-87f9f5279309abcd". Meant for the start of a game;

        const done = ctx.d0 - st.d;

  var S = { cols: [], stock: [], done: 0, moves: 0, suits: 4 };
  var hist = [], sel = null, hintMv = null, hintTimer = null;
  // the record of the whole game, kept apart from the undo list (hist keeps only the last 300 positions):
  //   rec.start = the deal (cols + stock) as dealt, rec.line = every move since: [from, row, to] (1-based columns, row =
  //   position of the first moved card from the bottom, as in json_db) or 'D'. null start = a game from before the record.
  var rec = { start: null, line: [] };
  var auto = false;   // true while the AI is making a move (so it is not treated as user input)

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board');

  // ---------- state helpers ----------
  function snapshot() { return JSON.stringify(S); }
  function pushHist() { hist.push(snapshot()); if (hist.length > 300) hist.shift(); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ S: S, hist: hist.slice(-60), rec: rec })); } catch (e) {} }
  function copyCards(cols) { return cols.map(function (col) { return col.map(function (c) { return c.slice(); }); }); }

  function newGame(suits) {
    stopAI(true);
    var deck = [], copies = 8 / suits, c, s, r, i;
    for (c = 0; c < copies; c++) for (s = 0; s < suits; s++) for (r = 1; r <= 13; r++) deck.push([r, s, 0]);
    for (i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    S = { cols: [], stock: [], done: 0, moves: 0, suits: suits };
    for (i = 0; i < 10; i++) {
      var n = i < 4 ? 6 : 5;
      S.cols.push(deck.splice(0, n));
      S.cols[i][n - 1][2] = 1;
    }
    S.stock = deck;
    rec = { start: { cols: copyCards(S.cols), stock: copyCards([S.stock])[0] }, line: [] };
    hist = []; sel = null; clearHint();
    $('overlay').classList.remove('show');
    save(); render();
  }

  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.S && d.S.cols && d.S.cols.length === 10) { S = d.S; hist = d.hist || []; rec = d.rec && d.rec.line ? d.rec : { start: null, line: [] }; return true; }
    } catch (e) {}
    return false;
  }

  // ---------- rules ----------
  // can cards from index i to the end of column c be picked up?
  function pickable(c, i) {
    var col = S.cols[c];
    if (i < 0 || i >= col.length || !col[i][2]) return false;
    for (var k = i; k < col.length - 1; k++) {
      if (col[k][1] !== col[k + 1][1] || col[k][0] !== col[k + 1][0] + 1) return false;
    }
    return true;
  }
  function canDrop(c, i, to) {
    if (c === to) return false;
    var dst = S.cols[to];
    if (!dst.length) return true;
    return dst[dst.length - 1][0] === S.cols[c][i][0] + 1;
  }
  function flipTop(c) {
    var col = S.cols[c];
    if (col.length && !col[col.length - 1][2]) col[col.length - 1][2] = 1;
  }
  // remove a finished K..A same-suit run from the end of column c
  function clearRuns() {
    var got = false;
    for (var c = 0; c < 10; c++) {
      var col = S.cols[c];
      if (col.length >= 13 && pickable(c, col.length - 13) && col[col.length - 13][0] === 13 && col[col.length - 1][0] === 1) {
        col.splice(col.length - 13, 13);
        flipTop(c);
        S.done++; got = true;
      }
    }
    return got;
  }

  function move(c, i, to) {
    if (!auto) stopAI(false);
    pushHist();
    rec.line.push([c + 1, i + 1, to + 1]);
    var moving = S.cols[c].splice(i);
    S.cols[to] = S.cols[to].concat(moving);
    flipTop(c);
    S.moves++;
    clearRuns();
    sel = null; clearHint();
    save(); render(); checkWin();
  }

  function dealRow() {
    if (!S.stock.length) return toast('No cards left to deal');
    if (S.cols.some(function (c) { return !c.length; })) return toast('Fill every empty column first');
    if (!auto) stopAI(false);
    pushHist();
    rec.line.push('D');
    var row = S.stock.splice(0, 10);
    row.forEach(function (card, k) { card[2] = 1; S.cols[k].push(card); });
    S.moves++;
    clearRuns();
    sel = null; clearHint();
    save(); render(); checkWin();
  }

  function undo() {
    if (!hist.length) return toast('Nothing to undo');
    stopAI(false);
    S = JSON.parse(hist.pop());
    rec.line.pop();
    sel = null; clearHint();
    save(); render();
  }

  function checkWin() {
    if (S.done === 8) {
      $('winInfo').textContent = S.moves + ' moves';
      $('overlay').classList.add('show');
    }
  }

  // ---------- hint ----------
  function findHint() {
    var best = null, bestScore = -1;
    for (var c = 0; c < 10; c++) {
      var col = S.cols[c];
      for (var i = 0; i < col.length; i++) {
        if (!pickable(c, i)) continue;
        var card = col[i], below = i > 0 ? col[i - 1] : null;
        var inSeq = below && below[2] && below[1] === card[1] && below[0] === card[0] + 1;
        for (var to = 0; to < 10; to++) {
          if (!canDrop(c, i, to)) continue;
          var dst = S.cols[to], top = dst.length ? dst[dst.length - 1] : null, score;
          if (top && top[1] === card[1]) score = 50;            // build same-suit
          else if (top) score = 20;                              // off-suit stack
          else score = 10;                                       // into empty column
          if (below && !below[2]) score += 30;                   // reveals a hidden card
          if (i === 0 && !top) continue;                         // pointless: whole column to empty
          if (i === 0 && !S.stock.length) score += 15;           // empties a column (only useful once the stock is gone:
                                                                 // a deal needs every column filled)
          if (inSeq && !(top && top[1] === card[1])) continue;   // would break a good run
          if (inSeq) score -= 15;
          if (score > bestScore) { bestScore = score; best = { c: c, i: i, to: to }; }
        }
      }
    }
    return best;
  }
  function clearHint() { hintMv = null; if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; } }
  // while cards are left to deal and a column is empty: a top card (not part of a good run) for the empty column
  function fillHint() {
    var to = -1, c, best = null;
    for (c = 0; c < 10; c++) if (!S.cols[c].length) { to = c; break; }
    if (to < 0 || !S.stock.length) return null;
    for (c = 0; c < 10; c++) {
      var col = S.cols[c], n = col.length;
      if (n < 2) continue;
      var top = col[n - 1], below = col[n - 2], good = below[2] && below[1] === top[1] && below[0] === top[0] + 1;
      if (!good && (!best || n > best.n)) best = { c: c, i: n - 1, to: to, n: n };
    }
    return best;
  }
  function showHint() {
    var h = solHint() || findHint();
    if (S.stock.length && S.cols.some(function (c) { return !c.length; }) && (!h || h.i === 0)) {
      var f = fillHint();
      if (f) { h = f; toast('Fill the empty columns, then deal'); }
    }
    if (!h) { toast(S.stock.length ? 'No moves — try dealing' : 'No moves left — try Undo'); return; }
    hintMv = h; sel = null; render();
    hintTimer = setTimeout(function () { hintMv = null; render(); }, 2800);
  }


  // ---------- AI (spider_ai.js: policy guided beam search, sees face-down cards) ----------
  var AI = window.SpiderAI;
  if (AI && window.SPIDER_MODEL) AI.setModel(window.SPIDER_MODEL);
  if (AI && window.SPIDER_MODELS) AI.setModels(window.SPIDER_MODELS);
  var sol = null;        // { moves, keys, ctx } - a winning line found by the solver
  var solver = null;     // running solve() handle
  var playTimer = null;

  function aiMsg(t) { $('ai').textContent = t || ''; }

  // game -> solver state. S.cols[c] is bottom -> top, face-down cards are at the bottom.
  function toAI() {
    var cols = S.cols.map(function (col) { return col.map(function (x) { return x[0] | (x[1] << 4); }); });
    var hid = S.cols.map(function (col) { var n = 0; col.forEach(function (x) { if (!x[2]) n++; }); return n; });
    var stock = S.stock.map(function (x) { return x[0] | (x[1] << 4); });
    var d = Math.floor(stock.length / 10);
    return { st: { cols: cols, hid: hid, d: d }, ctx: { stock: stock, d0: d, base: 104 } };
  }

  // index of the current position on the solution line, or -1
  function solIndex() {
    if (!sol) return -1;
    return sol.keys.indexOf(AI.encode(toAI().st));
  }
  function mvToHint(mv) {
    return mv.deal ? null : { c: mv.from, i: S.cols[mv.from].length - mv.n, to: mv.to };
  }
  function solHint() {
    var k = solIndex();
    if (k < 0 || k >= sol.moves.length) return null;
    var mv = sol.moves[k];
    if (mv.deal) { toast('Solution: deal'); return null; }
    return mvToHint(mv);
  }

  function stopAI(dropSolution) {
    if (solver) { solver.cancel(); solver = null; }
    if (playTimer) { clearTimeout(playTimer); playTimer = null; }
    if (dropSolution) sol = null;
    $('bSolve').classList.remove('on');
    $('bSolve').textContent = 'Solve';
    if (dropSolution) aiMsg('');
  }

  function play() {
    if (playTimer) { clearTimeout(playTimer); playTimer = null; }
    var k = solIndex();
    if (k < 0) { stopAI(false); aiMsg('Off the solution line - press Solve again'); return; }
    if (k >= sol.moves.length) { stopAI(false); return; }
    $('bSolve').classList.add('on'); $('bSolve').textContent = 'Stop';
    aiMsg('Playing ' + (k + 1) + ' / ' + sol.moves.length);
    var mv = sol.moves[k];
    auto = true;
    try {
      if (mv.deal) dealRow(); else move(mv.from, S.cols[mv.from].length - mv.n, mv.to);
    } finally { auto = false; }
    if (S.done < 8) playTimer = setTimeout(play, 450); else stopAI(false);
  }

  function solveAndPlay() {
    if (!AI) return toast('spider_ai.js not found');
    // toggle: running / playing -> stop
    if (solver || playTimer) { stopAI(false); aiMsg('Stopped'); return; }
    if (S.done === 8) return;
    if (solIndex() >= 0) return play();           // still on a known winning line
    var g = toAI();
    sol = null; sel = null; clearHint(); render();
    $('bSolve').classList.add('on'); $('bSolve').textContent = 'Stop';
    aiMsg('Solving...');
    var h = AI.solve(g.st, g.ctx, { maxMs: 120000 }, function (p) {
      aiMsg('Solving: ' + p.label + ' (' + p.stage + '/' + p.stages + ') · ' + Math.round(p.ms / 1000) + 's · sets ' + p.bestDone);
    });
    solver = h;
    h.promise.then(function (r) {
      if (solver !== h) return;                    // cancelled / replaced
      solver = null;
      if (r.status === 'solved') {
        sol = { moves: r.moves, keys: AI.replay(g.st, g.ctx, r.moves), ctx: g.ctx };
        aiMsg('Solved in ' + r.moves.length + ' moves (' + (r.ms / 1000).toFixed(1) + 's)');
        play();
      } else {
        stopAI(false);
        aiMsg(r.status === 'lost' ? 'No win exists from here - try Undo' : 'No solution found in time (may still be winnable)');
      }
    });
  }

  // ---------- save / load a game file ----------
  function saveFile() {
    var d = new Date(), p2 = function (x) { return (x < 10 ? '0' : '') + x; };
    var name = 'minspider_' + S.suits + 's_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.json';
    var out = { minspider: 2, S: S, hist: hist.slice(-60), start: rec.start, line: rec.line };
    if (rec.start) { out.cards = plCards(rec.start); out.answer = rec.line; }   // the same file is a json_db game for the other tools
    var blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast(rec.start ? 'Saved ' + name : 'Saved ' + name + ' (this game started before the record: only the last moves are in it)');
  }
  // the deal in the json_db / plspider layout: cards[0] = stock (last dealt first), cards[1..10] = columns bottom -> top,
  // a face-down card negative; suits renamed to the plspider order c s h d (minspider: 0 spades, 1 hearts, 2 clubs, 3 diamonds)
  var TO_PL = [1, 2, 0, 3];
  function plCode(x) { return x[0] | (TO_PL[x[1]] << 4); }
  function plCards(start) {
    var cards = [start.stock.map(plCode).reverse()];
    start.cols.forEach(function (col) { cards.push(col.map(function (x) { return x[2] ? plCode(x) : -plCode(x); })); });
    while (cards.length < 19) cards.push([]);
    return cards;
  }
  function validState(x) {      // 10 columns of [rank, suit, faceUp] and a stock, all cards accounted for
    if (!x || !Array.isArray(x.cols) || x.cols.length !== 10 || !Array.isArray(x.stock)) return false;
    var n = x.stock.length, ok = true;
    var card = function (c) { return Array.isArray(c) && c.length === 3 && c[0] >= 1 && c[0] <= 13 && c[1] >= 0 && c[1] <= 3; };
    x.cols.forEach(function (col) { if (!Array.isArray(col)) ok = false; else { n += col.length; col.forEach(function (c) { if (!card(c)) ok = false; }); } });
    x.stock.forEach(function (c) { if (!card(c)) ok = false; });
    return ok && x.done >= 0 && x.done <= 8 && n + x.done * 13 === 104 && [1, 2, 4].indexOf(x.suits) >= 0;
  }
  function loadFile(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { return toast('Not a valid json file'); }
    if (!d || !validState(d.S)) return toast('Not a MinSpider game file');
    stopAI(true);
    S = d.S; hist = Array.isArray(d.hist) ? d.hist : [];
    rec = d.start && Array.isArray(d.line) ? { start: d.start, line: d.line } : { start: null, line: [] };
    sel = null; clearHint();
    $('overlay').classList.remove('show');
    save(); render(); checkWin();
    toast('Game loaded');
  }

  // ---------- input ----------
  function onTap(e) {
    var colEl = e.target.closest('.col');
    if (!colEl) return;
    var c = +colEl.dataset.c;
    var cardEl = e.target.closest('.card');
    var i = cardEl ? +cardEl.dataset.i : -1;
    if (hintMv) { clearHint(); }

    if (sel) {
      if (sel.c === c && (i === sel.i || i === -1)) { sel = null; return render(); }
      if (canDrop(sel.c, sel.i, c)) return move(sel.c, sel.i, c);
      if (i >= 0 && pickable(c, i)) { sel = { c: c, i: i }; return render(); }
      shake(colEl); sel = null; return render();
    }
    if (i >= 0 && pickable(c, i)) {
      sel = { c: c, i: i };
      // convenience: if there's exactly one same-suit target, still wait for the user's second tap
      render();
    } else if (i >= 0) {
      shake(colEl);
    }
  }
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1500);
  }

  // ---------- render ----------
  function render() {
    var bw = boardEl.clientWidth, bh = boardEl.clientHeight;
    var two = window.matchMedia('(max-width: 700px) and (orientation: portrait)').matches;   // 2 rows x 5 columns
    var perRow = two ? 5 : 10, rowH = two ? (bh - 8 - Math.max(2, Math.min(4, bw / 100))) / 2 : bh;
    var gap = Math.max(2, Math.min(4, bw / 100));
    boardEl.style.setProperty('--gap', gap + 'px');
    var colW = (bw - gap * (perRow + 1)) / perRow;
    var cardH = Math.min(colW * 1.42, rowH / 4.2);
    // two rows: the cards keep their 1 : 1.42 shape (centred in the wider column) and the fonts follow the card width
    var cw = two ? Math.min(colW, cardH / 1.42) : colW;
    boardEl.style.setProperty('--cw', two ? cw + 'px' : '100%');
    boardEl.style.setProperty('--w', cw + 'px');
    var avail = rowH - 10 - cardH;
    var upGap = cw * 0.55, html = '';

    for (var c = 0; c < 10; c++) {
      var col = S.cols[c], n = col.length, hidden = 0;
      col.forEach(function (x) { if (!x[2]) hidden++; });
      var up = Math.min(upGap, cardH * .4), dn = up * .32;
      var need = hidden * dn + Math.max(0, n - hidden - 1) * up;
      if (need > avail) { var f = avail / need; up *= f; dn *= f; }
      var y = 2, cls = 'col' + (hintMv && hintMv.to === c ? ' hintdest' : '');
      html += '<div class="' + cls + '" data-c="' + c + '">';
      for (var i = 0; i < n; i++) {
        var cd = col[i], k = 'card ' + (cd[2] ? 's' + cd[1] : 'down');
        if (sel && sel.c === c && i >= sel.i) k += ' sel';
        if (hintMv && hintMv.c === c && i === hintMv.i) k += ' hint';
        html += '<div class="' + k + '" data-i="' + i + '" style="top:' + y.toFixed(1) + 'px;height:' + cardH.toFixed(1) + 'px">' +
          (cd[2] ? '<b>' + RANK[cd[0]] + '</b><i>' + SYM[cd[1]] + '</i><em>' + SYM[cd[1]] + '</em>' : '') + '</div>';
        y += cd[2] ? up : dn;
      }
      html += '</div>';
    }
    boardEl.innerHTML = html;
    $('badge').textContent = Math.ceil(S.stock.length / 10);
    $('badge').style.display = S.stock.length ? '' : 'none';
    $('deal').disabled = !S.stock.length;
    $('bUndo').disabled = !hist.length;
    $('info').textContent = S.suits + (S.suits === 1 ? ' suit' : ' suits') + ' · ' + S.moves + ' moves';
    $('score').textContent = '✔ ' + S.done + ' / 8';
  }

  // ---------- wiring ----------
  boardEl.addEventListener('click', onTap);
  $('bUndo').addEventListener('click', undo);
  $('bHint').addEventListener('click', showHint);
  $('bSolve').addEventListener('click', solveAndPlay);
  $('deal').addEventListener('click', dealRow);
  $('bFile').addEventListener('click', function () { $('fileMenu').classList.add('show'); });
  $('fCancel').addEventListener('click', function () { $('fileMenu').classList.remove('show'); });
  $('fNew').addEventListener('click', function () { $('fileMenu').classList.remove('show'); $('menu').classList.add('show'); });
  $('fSave').addEventListener('click', function () { $('fileMenu').classList.remove('show'); saveFile(); });
  $('fLoad').addEventListener('click', function () { $('fileMenu').classList.remove('show'); $('loadInput').click(); });
  $('loadInput').addEventListener('change', function () {
    var f = this.files[0]; this.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { loadFile(String(r.result)); };
    r.onerror = function () { toast('Could not read the file'); };
    r.readAsText(f);
  });
  $('mCancel').addEventListener('click', function () { $('menu').classList.remove('show'); });
  $('bAgain').addEventListener('click', function () { $('overlay').classList.remove('show'); $('menu').classList.add('show'); });
  Array.prototype.forEach.call(document.querySelectorAll('#menu [data-suits]'), function (b) {
    b.addEventListener('click', function () { $('menu').classList.remove('show'); newGame(+b.dataset.suits); });
  });
  window.addEventListener('resize', render);
  window.addEventListener('orientationchange', function () { setTimeout(render, 150); });
  // block pinch / double-tap zoom on iOS
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'z' || k === 'u') undo(); else if (k === 'h') showHint(); else if (k === 's') solveAndPlay(); else if (k === ' ') { e.preventDefault(); dealRow(); }
  });

  if (!load()) newGame(4); else { render(); checkWin(); }
  // layout settles after first paint on some mobile browsers
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
