<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Base64 Encoder / Decoder</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6; padding: 24px; max-width: 820px; margin: auto; }
    textarea { width: 100%; height: 160px; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 8px; padding: 12px; font-family: monospace; margin: 10px 0; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-right: 8px; }
    button:hover { background: #2563eb; }
    button.secondary { background: #374151; }
    .hint { font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <h2>Base64 Encoder / Decoder</h2>
  <textarea id="input" placeholder="Paste Base64 string here..."></textarea>
  <div>
    <button class="secondary" onclick="decodeToBox()">Decode to Box Below</button>
    <button class="secondary" onclick="encodeFromBox()">Encode Input to Base64</button>
  </div>
  <textarea id="output" placeholder="Decoded or encoded result appears here..."></textarea>

  <script>
    function decodeBase64UTF8(b64) {
      const clean = b64.replace(/\s+/g, "");
      const binStr = atob(clean);
      const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encodeBase64UTF8(str) {
      const bytes = new TextEncoder().encode(str);
      let binStr = "";
      bytes.forEach(b => binStr += String.fromCharCode(b));
      return btoa(binStr);
    }

    function decodeToBox() {
      try {
        document.getElementById("output").value = decodeBase64UTF8(document.getElementById("input").value);
      } catch (e) {
        alert("Invalid Base64 string: " + e.message);
      }
    }

    function encodeFromBox() {
      document.getElementById("output").value = encodeBase64UTF8(document.getElementById("input").value);
    }

  </script>
</body>
</html>
